// Built by build_apk.py (which writes the Firebase settings and signs the APK).
plugins { id 'com.android.application' version '8.11.0' }

android {
    namespace 'com.baytaar.router'
    compileSdk 35
    defaultConfig {
        applicationId 'com.baytaar.router'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res', 'build/firebase-res']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { checkReleaseBuilds false }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
