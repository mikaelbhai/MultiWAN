<style>
/* Dim light: cool grey paper, deep navy ink, one electric accent. */
:root {
  --bg: #e4e7ee;
  --card: rgba(250,251,253,.82); --solid: #f7f8fb; --inset: #eceef4;
  --line: rgba(15,23,42,.09); --line-2: rgba(15,23,42,.16);
  --ink: #0f172a; --ink-2: #475569; --ink-3: #7c8799;
  --a1: #2563eb; --a2: #06b6d4; --accent-soft: rgba(37,99,235,.1);
  --grad: linear-gradient(120deg, #2563eb, #06b6d4);
  --ok: #059669; --ok-soft: rgba(5,150,105,.12);
  --warn: #b45309; --warn-soft: rgba(180,83,9,.12);
  --bad: #dc2626; --bad-soft: rgba(220,38,38,.1);
  --r: 22px; --r-md: 16px; --r-sm: 11px;
  --shadow: 0 1px 1px rgba(15,23,42,.04), 0 10px 30px -12px rgba(15,23,42,.18);
  --shadow-lg: 0 2px 4px rgba(15,23,42,.05), 0 30px 60px -24px rgba(15,23,42,.3);
  --display: "Sora", "Plus Jakarta Sans", system-ui, sans-serif;
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 500 14.5px/1.5 var(--sans);
  min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
a { color: var(--a1); text-decoration: none; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.lg { width: 24px; height: 24px; }

/* ---------- living background ---------- */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
.aurora i:nth-child(1) { width: 46vmax; height: 46vmax; left: -12vmax; top: -16vmax; background: #b9cdfb; animation: drift1 22s var(--ease) infinite alternate; }
.aurora i:nth-child(2) { width: 38vmax; height: 38vmax; right: -12vmax; top: 8vmax; background: #b5e9f0; animation: drift2 26s var(--ease) infinite alternate; }
.aurora i:nth-child(3) { width: 34vmax; height: 34vmax; left: 22vmax; bottom: -20vmax; background: #d7d2f7; animation: drift3 30s var(--ease) infinite alternate; }
.aurora::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(15,23,42,.07) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(#000, transparent 75%); -webkit-mask-image: linear-gradient(#000, transparent 75%); }
@keyframes drift1 { to { transform: translate(9vmax, 7vmax) scale(1.12); } }
@keyframes drift2 { to { transform: translate(-8vmax, 9vmax) scale(.92); } }
@keyframes drift3 { to { transform: translate(6vmax, -8vmax) scale(1.1); } }

/* ---------- logo ---------- */
.logo { display: flex; align-items: center; gap: 11px; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; flex: none; box-shadow: 0 6px 16px -6px rgba(37,99,235,.7), inset 0 1px 0 rgba(255,255,255,.35); }
.logo-mark svg { width: 20px; height: 20px; }
.logo-mark rect { fill: #fff; transform-origin: 50% 100%; transform-box: fill-box; animation: bars 2.4s var(--ease) infinite; }
.logo-mark rect:nth-child(2) { animation-delay: .18s; }
.logo-mark rect:nth-child(3) { animation-delay: .36s; }
@keyframes bars { 0%, 55%, 100% { transform: scaleY(1); } 28% { transform: scaleY(.55); } }
.logo b { font: 700 18px/1 var(--display); letter-spacing: -.03em; }

/* ---------- controls ---------- */
input[type=text], input[type=email], input[type=password] {
  width: 100%; background: rgba(255,255,255,.7); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 12px 13px; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
}
input::placeholder { color: var(--ink-3); }
input:focus { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(37,99,235,.14); background: #fff; }
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden;
  border: 1px solid var(--line-2); background: rgba(255,255,255,.75); color: var(--ink); border-radius: 12px;
  padding: 10px 16px; cursor: pointer; font-weight: 700; font-size: 14px; white-space: nowrap; min-height: 44px;
  transition: transform .2s var(--ease), box-shadow .2s, background .2s, border-color .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -12px rgba(15,23,42,.4); background: #fff; }
.btn:active { transform: translateY(0) scale(.98); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(37,99,235,.25); }
.btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn.primary { background: var(--grad); background-size: 160% 100%; border-color: transparent; color: #fff; box-shadow: 0 10px 24px -12px rgba(37,99,235,.85), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.primary:hover { background-position: 100% 0; box-shadow: 0 16px 30px -12px rgba(37,99,235,.9), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); transition: left .6s var(--ease); }
.btn.primary:hover::after { left: 120%; }
.btn .go { transition: transform .25s var(--ease); }
.btn:hover .go { transform: translateX(4px); }
.btn.block { width: 100%; min-height: 48px; font-size: 15px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); min-height: 38px; padding: 7px 12px; }
.btn.ghost:hover { background: rgba(15,23,42,.06); box-shadow: none; transform: none; color: var(--ink); }
.btn.sm { min-height: 38px; padding: 7px 13px; font-size: 13px; border-radius: 10px; }
.btn[aria-disabled=true] { opacity: .45; pointer-events: none; }

/* ---------- sign in ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
.auth-wrap { width: 100%; max-width: 410px; animation: rise .7s var(--ease) both; }
.auth-card { background: var(--card); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.7); border-radius: 26px; padding: 34px 30px 28px; box-shadow: var(--shadow-lg); }
.auth-card .logo-mark { width: 46px; height: 46px; border-radius: 14px; }
.auth-card .logo-mark svg { width: 25px; height: 25px; }
.auth-card h1 { font: 700 28px/1.15 var(--display); letter-spacing: -.035em; margin: 26px 0 6px; }
.auth-card h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.auth-card p.lead { color: var(--ink-2); margin: 0 0 24px; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 7px; }
.inp { position: relative; display: block; }
.inp svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; transition: color .2s; }
.inp:focus-within svg { color: var(--a1); }
.inp input[type] { padding-left: 40px; }
.err { display: flex; gap: 8px; align-items: flex-start; background: var(--bad-soft); color: var(--bad); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; margin-top: 14px; animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.auth-foot { text-align: center; color: var(--ink-3); font-size: 12.5px; margin-top: 18px; }
.hint-reg { color: var(--ink-3); font-size: 12.5px; margin: -4px 0 14px; line-height: 1.45; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- shell ---------- */
.top { position: sticky; top: 0; z-index: 5; background: rgba(228,231,238,.72); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 11px 20px; display: flex; align-items: center; gap: 12px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 13px; font-weight: 600; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font: 700 12.5px var(--display); flex: none; }
main { max-width: 1120px; margin: 0 auto; padding: 30px 20px 64px; }
.page-h { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 22px; animation: rise .6s var(--ease) both; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--a1); }
.page-h h1 { font: 700 34px/1.1 var(--display); letter-spacing: -.04em; margin: 6px 0 0; }
.page-h p { color: var(--ink-2); margin: 6px 0 0; }
.sync { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
.sync.live i { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
.sync.off i { background: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,.18); }
.count { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; background: var(--card); border: 1px solid rgba(255,255,255,.7); border-radius: 999px; padding: 8px 15px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; position: relative; }
.dot.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: ping 1.8s var(--ease) infinite; }
@keyframes ping { to { transform: scale(3.2); opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

/* ---------- router ---------- */
.router { margin-bottom: 26px; }
.router.enter .glass { animation: rise .7s var(--ease) both; }
.router.enter .glass:nth-child(2) { animation-delay: .1s; }
.router.enter .glass:nth-child(3) { animation-delay: .2s; }
.glass { background: var(--card); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.75); border-radius: var(--r); box-shadow: var(--shadow); }

/* hero */
.hero { position: relative; padding: 24px; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); background-size: 200% 100%; animation: slide 4s linear infinite; }
.hero.off::before { background: var(--bad); animation: none; opacity: .6; }
.hero.mid::before { background: #f59e0b; animation: none; }
@keyframes slide { to { background-position: -200% 0; } }
.h-top { display: flex; gap: 16px; align-items: center; }
.r-ico { position: relative; width: 58px; height: 58px; border-radius: 18px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 14px 28px -12px rgba(37,99,235,.8), inset 0 1px 0 rgba(255,255,255,.35); }
.r-ico svg { width: 28px; height: 28px; }
.r-ico.live::before, .r-ico.live::after { content: ""; position: absolute; inset: 0; border-radius: 18px; border: 2px solid var(--a1); animation: ring 2.6s var(--ease) infinite; }
.r-ico.live::after { animation-delay: 1.3s; }
@keyframes ring { from { transform: scale(1); opacity: .6; } to { transform: scale(1.55); opacity: 0; } }
.hero.off .r-ico { background: #94a3b8; box-shadow: none; }
.r-title { min-width: 0; flex: 1; }
.r-title h2 { margin: 0; font: 700 23px/1.2 var(--display); letter-spacing: -.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-loc { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.r-loc svg { color: var(--ink-3); }
.link { background: none; border: 0; padding: 2px 6px; margin-left: 2px; border-radius: 7px; color: var(--a1); cursor: pointer; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; transition: background .2s; }
.link:hover { background: var(--accent-soft); }
.link:disabled { color: var(--ink-3); cursor: default; background: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; font: 700 13px var(--display); letter-spacing: -.01em; }
.pill.on  { background: var(--ok-soft);   color: var(--ok); }
.pill.off { background: var(--bad-soft);  color: var(--bad); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.loc-edit { display: flex; gap: 8px; margin-top: 16px; animation: rise .35s var(--ease) both; }
.loc-edit input { flex: 1; min-width: 0; }
.notice { display: flex; gap: 9px; align-items: center; margin-top: 16px; padding: 11px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; }

/* live path: router -> line -> internet */
.h-body { display: grid; grid-template-columns: 1fr 250px; gap: 22px; margin-top: 22px; align-items: stretch; }
.path { background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 18px 18px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.path-k { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; display: flex; align-items: center; gap: 7px; }
.hops { display: flex; align-items: flex-start; }
.hop { flex: none; width: 104px; text-align: center; }
.hop-ico { width: 50px; height: 50px; margin: 0 auto 9px; border-radius: 15px; background: #fff; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink-2); transition: transform .3s var(--ease); }
.hop:hover .hop-ico { transform: translateY(-3px) scale(1.05); }
.hop.hot .hop-ico { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 12px 22px -10px rgba(37,99,235,.8); }
.hop b { display: block; font: 600 13.5px/1.25 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.hop span { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; overflow-wrap: anywhere; }
.wire { flex: 1; min-width: 18px; height: 3px; margin-top: 24px; border-radius: 3px; background: rgba(15,23,42,.1); position: relative; overflow: hidden; }
.path.live .wire::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40px; right: 0; background: repeating-linear-gradient(90deg, #2563eb 0 12px, #06b6d4 12px 16px, transparent 16px 40px); animation: flow .9s linear infinite; }
@keyframes flow { to { transform: translateX(40px); } }
.path.dead .hop.hot .hop-ico { background: #fff; color: var(--bad); border-color: var(--bad); box-shadow: none; }
.path.dead .wire { background: repeating-linear-gradient(90deg, rgba(220,38,38,.45) 0 6px, transparent 6px 12px); }

/* gauge */
.gauge { background: #0f172a; color: #e2e8f0; border-radius: var(--r-md); padding: 18px 18px 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.gauge::before { content: ""; position: absolute; width: 220px; height: 220px; right: -90px; top: -110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(6,182,212,.4), transparent); }
.gauge-k { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; display: flex; align-items: center; gap: 7px; position: relative; }
.gauge svg.arc { display: block; width: 100%; max-width: 210px; margin: 8px auto 0; overflow: visible; }
.arc .track { fill: none; stroke: rgba(148,163,184,.22); stroke-width: 12; stroke-linecap: round; }
.arc .fill { fill: none; stroke: url(#gg); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 251.4; stroke-dashoffset: 251.4; transition: stroke-dashoffset 1.6s var(--ease); filter: drop-shadow(0 0 7px rgba(6,182,212,.7)); }
.gauge-v { text-align: center; margin-top: -44px; position: relative; }
.gauge-v b { font: 700 38px/1 var(--display); letter-spacing: -.04em; color: #fff; font-variant-numeric: tabular-nums; }
.gauge-v small { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 5px; }
.gauge-s { text-align: center; color: #94a3b8; font-size: 12px; margin-top: auto; padding-top: 12px; position: relative; }

/* facts */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
.fact { padding: 16px 18px; display: flex; gap: 13px; align-items: center; min-width: 0; transition: transform .3s var(--ease), box-shadow .3s; }
.fact:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.f-ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--a1); }
.fact:nth-child(2) .f-ico { background: rgba(6,182,212,.14); color: #0891b2; }
.fact:nth-child(3) .f-ico { background: rgba(124,58,237,.12); color: #7c3aed; }
.fact > div:last-child { min-width: 0; }
.f-k { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.f-v { font: 600 15.5px/1.3 var(--display); letter-spacing: -.02em; margin-top: 3px; overflow-wrap: anywhere; }
.f-v.mono { font: 600 14.5px/1.3 var(--mono); letter-spacing: 0; }

/* lines */
.lines { margin-top: 14px; overflow: hidden; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 18px 22px 14px; }
.sec-h h3 { margin: 0; font: 700 16px var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
.sec-h h3 small { font: 600 12.5px var(--sans); color: var(--ink-3); letter-spacing: 0; }
.auto { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.auto input { position: absolute; opacity: 0; }
.auto .t { width: 42px; height: 24px; border-radius: 999px; background: rgba(15,23,42,.18); position: relative; flex: none; transition: background .25s; }
.auto .t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.auto input:checked + .t { background: var(--grad); }
.auto input:checked + .t::after { transform: translateX(18px); }
.auto input:focus-visible + .t { box-shadow: 0 0 0 4px rgba(37,99,235,.25); }

.line { display: flex; gap: 16px; padding: 18px 22px; align-items: flex-start; border-top: 1px solid var(--line); position: relative; transition: background .25s; }
.line:hover { background: rgba(255,255,255,.55); }
.line.act::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--grad); }
.slot { flex: none; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font: 700 16px var(--display); background: var(--inset); color: var(--ink-2); border: 1px solid var(--line-2); }
.line.act .slot { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 10px 20px -10px rgba(37,99,235,.8); }
.l-main { min-width: 0; flex: 1; }
.l-name { font: 600 16.5px/1.3 var(--display); letter-spacing: -.02em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 700 11.5px var(--sans); letter-spacing: 0; padding: 3px 9px; border-radius: 999px; }
.tag.ok  { background: var(--ok-soft);   color: var(--ok); }
.tag.bad { background: var(--bad-soft);  color: var(--bad); }
.tag.mid { background: var(--warn-soft); color: var(--warn); }
.tag.use { background: var(--grad); color: #fff; }
.l-meta { color: var(--ink-2); font-size: 13px; margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px 18px; }
.l-meta span { display: inline-flex; align-items: center; gap: 6px; }
.l-meta svg { color: var(--ink-3); }
.l-meta code { font: 500 12.5px var(--mono); }

.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #0f172a; color: #f1f5f9; padding: 12px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 20; max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 9px; animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; }

.skel { height: 420px; border-radius: var(--r); background: linear-gradient(100deg, rgba(255,255,255,.35) 30%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.35) 70%); background-size: 200% 100%; animation: sh 1.4s infinite linear; }

.seg { display: inline-flex; background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-left: auto; }

.g-btn { margin-left: auto; align-self: center; flex: none; }

.s-apps button { border: 1px solid var(--line); background: var(--inset); color: var(--ink-2); font: 600 13px var(--body, inherit); padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .2s, border-color .2s, color .2s; }

#pick { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
#pick:empty { display: none; }
#pick button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card, rgba(255,255,255,.6)); color: var(--ink-2); padding: 10px 16px 10px 12px; border-radius: 14px; cursor: pointer; font: inherit; transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }

#pick .pgroup { display: flex; flex-direction: column; gap: 7px; padding: 9px 10px 10px; border-radius: 18px; background: rgba(255,255,255,.45); border: 1px solid var(--line); }
#pick .pg-h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 4px; }
#pick .pg-row { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }

#pick .pg-row button:first-child { border-radius: 14px 0 0 14px; }

/* the place panel */
#place:empty { display: none; }
.place { padding: 20px 22px; margin: 0 0 18px; }
.pl-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pl-head h2 { margin: 0; font: 700 20px var(--display); letter-spacing: -.02em; }
.pl-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; }

.pl-node { flex: 1 1 0; min-width: 150px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start; }
.pl-node .ni { width: 38px; height: 38px; border-radius: 12px; background: #fff; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }

.pl-link { flex: 0 0 34px; display: grid; place-items: center; color: var(--ink-3); }

.pl-sec { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.pl-sec > .pl-st { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.pl-sec > .pl-st .grow { flex: 1; }
.pl-dev { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 13.5px; }
.pl-dev:first-of-type { border-top: 0; }
.pl-dev .dn { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-dev .dm { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--inset); color: var(--ink-2); white-space: nowrap; }
.chip.main { background: var(--accent-soft); color: var(--a1); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.pl-r { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pl-r:first-of-type { border-top: 0; }
.pl-r .rn { flex: 1; min-width: 140px; }
.pl-r .rn b { font: 700 14px var(--display); }
.pl-r .rn span { display: block; font-size: 12px; color: var(--ink-3); }
.pl-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pl-add select, .pl-add input { flex: 1; min-width: 160px; box-sizing: border-box; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,.75); font: inherit; font-size: 14px; }
/* a place is ONE tile in the picker */
#pick .ptile { display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 16px 11px 12px; border-radius: 16px; }
#pick .ptile .pt-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--a1); flex: none; }
#pick .ptile.on .pt-ico { background: rgba(255,255,255,.22); color: #fff; }
#pick .ptile .pt-dots { display: inline-flex; gap: 4px; margin-left: 6px; }
#pick .ptile .pt-dots i { width: 7px; height: 7px; box-shadow: none !important; }
/* place tabs: what is shared, and what is each router's own */
.ptabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 0; padding: 4px; background: var(--inset); border: 1px solid var(--line); border-radius: 14px; }
.ptab { flex: 1 1 auto; border: 0; background: none; padding: 10px 14px; border-radius: 11px; font: 700 13.5px var(--sans); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, color .2s, box-shadow .2s; white-space: nowrap; }
.ptab:hover { color: var(--ink); background: rgba(255,255,255,.6); }
.ptab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 6px 16px -10px rgba(15,23,42,.35); }
.ptab small { font-weight: 600; color: var(--ink-3); }
.ptab .kind { font: 700 10px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--a1); }
.ptab .kind.own { background: var(--inset); color: var(--ink-2); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: var(--r-md); margin: 0 0 14px; font-size: 13.5px; line-height: 1.5; }
.banner.shared { background: var(--accent-soft); color: #1e3a8a; }

.banner svg { flex: none; margin-top: 2px; }

/* people and devices: one list for the whole place */
.pp-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; padding: 13px 22px; border-top: 1px solid var(--line); align-items: center; transition: background .2s; }

.pp-row.away .pp-av { background: var(--inset); color: var(--ink-3); }

.pp-name { font: 600 15px var(--display); letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pp-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 3px; color: var(--ink-3); font-size: 12.5px; }
.pp-meta span { display: inline-flex; align-items: center; gap: 5px; }
.pp-meta code { font: 500 12px var(--mono); color: var(--ink-2); }
.pp-where { display: inline-flex; align-items: center; gap: 6px; }
.pp-act { display: flex; gap: 6px; align-items: center; }
.pp-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 22px 14px; }
.pp-tools input { flex: 1; min-width: 180px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,.75); font: inherit; font-size: 14px; }
.pp-filter { display: inline-flex; background: var(--inset); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.pp-filter button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; font: 700 12.5px var(--sans); color: var(--ink-2); cursor: pointer; }
.pp-filter button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.1); }
/* a router's own network numbers */
.netgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 4px 22px 18px; }
.netgrid div { background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.netgrid span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.netgrid b { display: block; font: 600 14.5px var(--mono); margin-top: 3px; overflow-wrap: anywhere; }
.pl-manage { margin-top: 12px; }
@media (max-width: 640px) {
  .ptab { flex: 1 1 45%; padding: 9px 8px; font-size: 13px; }
  .pp-row { grid-template-columns: 36px minmax(0, 1fr); padding: 12px 16px; }
  .pp-act { grid-column: 2; }

}

  #pick .pg-row button:first-child { border-radius: 14px 14px 0 0; }
  #pick .pg-row button:last-child { border-radius: 0 0 14px 14px; }
  #pick .pg-row button:only-child { border-radius: 14px; }
  #pick .pg-row button + button { border-left: 1px solid var(--line); border-top: 0; }
}
.fw-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 4px 22px 20px; }

@media (max-width: 640px) { #pick button { flex: 1 1 45%; } .fw-row { padding-left: 16px; padding-right: 16px; } .fw-row .g-btns { margin-left: 0; width: 100%; } }

/* ---------- call quality + devices ---------- */
.block { margin-top: 14px; overflow: hidden; }

@media (max-width: 640px) { #appbox .app-btns { padding: 0 16px 16px; } }
.block .sec-h { padding-bottom: 6px; }

.q-row { padding: 18px 22px; border-top: 1px solid var(--line); animation: rise .45s var(--ease) both; }

.v-bars i.on:nth-child(2) { animation-delay: .08s; } .v-bars i.on:nth-child(3) { animation-delay: .16s; } .v-bars i.on:nth-child(4) { animation-delay: .24s; }

.d-main { min-width: 0; flex: 1; }
.d-name { font: 600 15px var(--display); letter-spacing: -.02em; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }

/* foldable sections: a round arrow at the right of every section title */
.has-fold { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.has-fold > :first-child { margin-right: auto; min-width: 0; }

.fold-btn { all: unset; box-sizing: border-box; flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  color: var(--ink-3, var(--text-dim)); background: var(--inset, var(--surface-2)); border: 1px solid var(--line, var(--border)); transition: color .2s, background .2s; }

.folded > .card-head > :not(:first-child):not(.fold-btn) { display: none !important; }

.d-more { all: unset; cursor: pointer; margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--a1); display: inline-flex; align-items: center; gap: 6px; }

.site-h { position: sticky; top: 0; z-index: 1; background: #f4f6f9; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding-top: 7px; padding-bottom: 7px; }

      bringToLife(box, panimate);
    }
    return;
  }

  // Redraw only when something actually changed, so nothing flickers or
  // replays its animation every poll. "last seen" is rounded to the minute.
  var key = JSON.stringify(list.map(function (r) { return [r.id, r.reachable, r.site, r.reachable ? 0 : Math.round((now - (r.last_seen || 0)) / 60)]; }));
  if (key === lastKey) return;
  // Never redraw under someone's cursor.
  var a = document.activeElement;
  if (a && a.tagName === 'INPUT' && a.type !== 'checkbox' && box.contains(a)) return;
  lastKey = key;

  var openLoc = {};
  $$('[data-router]', box).forEach(function (el) {
    var b = $('[data-loc-box]', el); if (b && !b.hidden) openLoc[el.getAttribute('data-router')] = 1;
  });

  var animate = firstPaint; firstPaint = false;
  box.innerHTML = list.map(function (r) { return card(r, now, animate); }).join('');
  list.forEach(function (r) { wire(r, openLoc[r.id]); });
  bringToLife(box, animate);
}

/* Gauge sweep, bar growth and number count-up. On a data refresh the values
   are set straight away; the entrance animation is only for the first paint. */
function bringToLife(box, animate) {
  var run = function () {
    $$('.arc .fill', box).forEach(function (p) {
      if (!animate) p.style.transition = 'none';
      p.style.strokeDashoffset = String(251.4 * (1 - parseFloat(p.getAttribute('data-frac') || 0)));
    });
    $$('.bar i', box).forEach(function (b) {
      if (!animate) b.style.transition = 'none';
      b.style.width = b.getAttribute('data-w') + '%';
    });
  };
  if (animate) requestAnimationFrame(function () { requestAnimationFrame(run); }); else run();

  $$('[data-count]', box).forEach(function (el) {
    var to = parseFloat(el.getAttribute('data-count'));
    if (!animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to.toFixed(1); return; }
    var t0 = null, dur = 1600;
    function step(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = (to * e).toFixed(1);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function card(r, now, animate, inPlace) {
  var s = r.site || {};
  var wans = (s.wans || []).slice().sort(function (x, y) { return (x.priority || 9) - (y.priority || 9); });
  var act = wans.filter(function (w) { return w.active; })[0];
  var state, cls;
  if (!r.reachable)      { state = 'Offline'; cls = 'off'; }
  else if (!s.internet)  { state = 'No internet'; cls = 'mid'; }
  else                   { state = 'Online'; cls = 'on'; }
  var stale = !r.reachable, live = r.reachable && s.internet;
  var max = mbps(s.active_max_down_mbps !== null && s.active_max_down_mbps !== undefined ? s.active_max_down_mbps : s.max_down_mbps);
  var dis = r.reachable ? '' : ' disabled';
  var top = max === null ? 100 : scaleFor(max);
  var bestAll = Math.max.apply(null, wans.map(function (w) { return w.max_down_mbps || 0; }).concat([1]));

  var lines = wans.map(function (w) {
    var up = w.tracker === 'online';
    var tag = !w.connected ? '<span class="tag bad">Not connected</span>'
            : up ? '<span class="tag ok">Healthy</span>' : '<span class="tag mid">' + esc(w.tracker) + '</span>';
    var best = mbps(w.max_down_mbps);
    var can = w.connected && r.reachable;
    var ek = r.id + ':' + w.iface;
    return '<div class="line' + (w.active && !stale ? ' act' : '') + '">' +
      '<div class="slot" title="Priority ' + esc(w.priority || '') + '">' + esc(w.priority || '–') + '</div>' +
      '<div class="l-main">' +
        '<div class="l-name">' + esc(lineTitle(w)) +
          (w.active && !stale ? ' <span class="tag use">' + ic('check', 'sm') + 'In use</span>' : '') +
          (s.forced === w.iface ? ' <span class="tag mid">Forced</span>' : '') + ' ' + tag + '</div>' +
        '<div class="l-meta">' +
          '<span>' + ic('port', 'sm') + esc(w.iface.toUpperCase()) + ', port ' + esc(w.device) + '</span>' +
          (w.isp ? '<span>' + ic('building', 'sm') + esc(w.isp) + '</span>' : '') +
          (w.public_ip ? '<span>' + ic('globe', 'sm') + '<code>' + esc(w.public_ip) + '</code></span>' : '') +
          (w.ip_location ? '<span>' + ic('pin', 'sm') + esc(w.ip_location) + '</span>' : '') +
          (w.connected && typeof w.devices === 'number' ? '<span title="Different devices with a connection open on this line right now. Everything behind a Wi-Fi router counts as one.">' + ic('activity', 'sm') + w.devices + (w.devices === 1 ? ' device' : ' devices') + ' using it now</span>' : '') + '</div>' +
        (best !== null
          ? '<div class="bar"><i data-w="' + Math.max(4, Math.round(best / bestAll * 100)) + '"></i></div>' +
            '<div class="bar-s"><span>Best download seen</span><b>' + best + ' Mbps</b></div>'
          : '') +
        '<div class="l-edit" data-edit="' + esc(w.iface) + '"' + (openEdits[ek] ? '' : ' hidden') + '>' +
          '<input type="text" maxlength="32" data-name="' + esc(w.iface) + '" value="' + esc(w.label) + '" placeholder="Name this line, e.g. Office Fibre">' +
          '<button class="btn primary sm" data-save="' + esc(w.iface) + '">Save</button></div>' +
      '</div>' +
      '<div class="l-btns">' +
      (s.forced === w.iface
        ? '<button class="btn sm" data-force="" title="Go back to the normal line order">' + ic('unplug', 'sm') + 'Stop forcing</button>'
        : '<button class="btn sm" data-force="' + esc(w.iface) + '" title="Send all traffic through this line"' + (can && up ? '' : ' disabled') + '>' + ic('plug', 'sm') + 'Use only this</button>') +
      '<button class="btn sm" data-test-line="' + esc(w.iface) + '" title="Measure speed, delay, provider, public IP and location"' + (can ? '' : ' disabled') + '>' +
        (TESTING[ek] ? '<span class="spinner"></span> Testing' : ic('gauge', 'sm') + 'Test') + '</button>' +
      '<button class="icon-btn" data-edit-open="' + esc(w.iface) + '" title="' + (can ? 'Rename this line' : 'Connect a line to name it') + '"' + (can ? '' : ' disabled') + '>' + ic('pencil', 'sm') + '</button></div>' +
      '</div>';
  }).join('');

  var pathCls = live ? 'live' : (stale ? '' : 'dead');
  var path =
    '<div class="path ' + pathCls + '">' +
      '<div class="path-k">' + ic('activity', 'sm') + (stale ? 'Last known route' : (live ? 'Traffic is flowing through' : 'No working route')) + '</div>' +
      '<div class="hops">' +
        '<div class="hop"><div class="hop-ico">' + ic('router', 'lg') + '</div><b>Router</b><span>' + esc(s.hostname || r.name) + '</span></div>' +
        '<div class="wire"></div>' +
        '<div class="hop hot"><div class="hop-ico">' + ic(act ? 'plug' : 'unplug', 'lg') + '</div><b>' + (act ? esc(lineTitle(act)) : 'No line') + '</b>' +
          '<span>' + (act ? esc(act.iface.toUpperCase()) + ', port ' + esc(act.device) : 'nothing is up') + '</span></div>' +
        '<div class="wire"></div>' +
        '<div class="hop"><div class="hop-ico">' + ic('globe', 'lg') + '</div><b>Internet</b><span>' + esc(s.active_isp || 'unknown provider') + '</span></div>' +
      '</div></div>';

  var gauge =
    '<div class="gauge">' +
      '<div class="gauge-k">' + ic('gauge', 'sm') + 'Max download</div>' +
      '<svg class="arc" viewBox="0 0 200 112"><path class="track" d="M20 100 A80 80 0 0 1 180 100"/>' +
        '<path class="fill" data-frac="' + (max === null ? 0 : Math.min(1, max / top)) + '" d="M20 100 A80 80 0 0 1 180 100"/></svg>' +
      '<div class="gauge-v"><b' + (max === null ? '' : ' data-count="' + max + '"') + '>' + (max === null ? '&mdash;' : '0.0') + '</b><small>' + (max === null ? 'not measured yet' : 'Mbps') + '</small></div>' +
      '<div class="gauge-s">' + (max === null ? 'Run a speed test through this router' : 'Best seen on this line, scale to ' + top) + '</div>' +
    '</div>';

  return '<section class="router' + (animate ? ' enter' : '') + '" data-router="' + r.id + '">' +
    (inPlace ? '<div class="banner own">' + ic('router') + '<div><b>Only ' + esc(r.name) + '.</b> Its internet line, Wi-Fi name and password, and network address belong to this router alone. ' +
      'People, devices and the rules are shared: see <b>People &amp; devices</b> and <b>Rules for everyone</b>.</div></div>' : '') +
    '<div class="glass hero ' + cls + '">' +
      '<div class="h-top">' +
        '<div class="r-ico' + (live ? ' live' : '') + '">' + ic('router') + '</div>' +
        '<div class="r-title"><h2>' + esc(r.name || s.hostname) + '</h2>' +
          '<div class="r-loc">' + ic('pin', 'sm') + '<span>' + esc(s.location || 'No location set') + '</span>' +
            '<button class="link" data-loc-open' + dis + '>' + ic('pencil', 'sm') + (s.location ? 'Change' : 'Set location') + '</button></div></div>' +
        '<span class="pill ' + cls + '"><span class="dot' + (cls === 'on' ? ' live' : '') + '"></span>' + state + '</span>' +
      '</div>' +
      '<div class="loc-edit" data-loc-box hidden>' +
        '<input type="text" maxlength="120" data-loc value="' + esc(s.location) + '" placeholder="Where is this router? e.g. Head office, 2nd floor">' +
        '<button class="btn primary sm" data-loc-save>Save</button></div>' +
      (stale ? '<div class="notice">' + ic('clock', 'sm') + '<span>Not connected to Baytaar right now. Showing what this router last reported, ' + esc(ago(r.last_seen, now)) + '.</span></div>' : '') +
      '<div class="h-body">' + path + gauge + '</div>' +
    '</div>' +

    '<div class="facts">' +
      '<div class="glass fact"><div class="f-ico">' + ic('building') + '</div><div><div class="f-k">Provider</div><div class="f-v">' + esc(s.active_isp || 'Unknown') + '</div></div></div>' +
      '<div class="glass fact"><div class="f-ico">' + ic('globe') + '</div><div><div class="f-k">Public IP</div><div class="f-v mono">' + esc(s.public_ip || 'Unknown') + '</div></div></div>' +
      '<div class="glass fact"><div class="f-ico">' + ic('pin') + '</div><div><div class="f-k">IP location</div><div class="f-v">' + esc(s.ip_location || 'Unknown') + '</div></div></div>' +
    '</div>' +

    '<div class="glass lines">' +
      '<div class="sec-h"><h3>' + ic('plug') + 'Internet lines <small>' + wans.length + '</small></h3>' +
        (wans.length <= 1 ? '' :
        '<div class="seg" role="group" aria-label="How lines are used">' +
          '<button data-mode="failover"' + (s.mwan_mode !== 'balance' ? ' class="on"' : '') + dis + '>' + ic('arrow', 'sm') + 'One at a time</button>' +
          '<button data-mode="balance"' + (s.mwan_mode === 'balance' ? ' class="on"' : '') + dis + '>' + ic('activity', 'sm') + 'Mix all lines</button></div>' +
        (s.mwan_mode === 'balance' ? '' :
        '<label class="auto"><input type="checkbox" data-auto' + (s.auto_slot ? ' checked' : '') + dis + '>' +
        '<span class="t"></span><span>Fastest line first</span></label>')) + '</div>' +
      (wans.length <= 1 ? '' : '<p class="mix-note">' + (s.forced
        ? 'Forced: everything goes through ' + esc(s.forced.toUpperCase()) + (typeof s.devices_total === 'number' ? ' (' + s.devices_total + (s.devices_total === 1 ? ' device' : ' devices') + ' in use)' : '') + '. The other lines only step in if it fails, so the router stays online. If the forced line stays down for a minute the router stops forcing by itself. Press Stop forcing to go back.'
        : s.mwan_mode === 'balance'
        ? 'Mixing: every connected line carries traffic at the same time. One download still uses one line, but different apps and devices spread across all of them.'
        : 'One at a time: the top line carries everything, the next one takes over within seconds if it fails.') + '</p>') +
      (lines || '<div class="line"><div class="l-main" style="color:var(--ink-2)">No lines reported yet.</div></div>') +
    '</div>' +

    (inPlace
      // in a place: only what this router keeps for itself (people, devices and rules are on the shared tabs)
      ? '<div class="glass block" data-wifi="' + r.id + '">' + wifiHtml(r.id) + '</div>' +
        '<div class="glass block" data-lan="' + r.id + '"></div>' +
        '<div class="glass block" data-quality="' + r.id + '"></div>' +
        '<div class="glass block" data-apps="' + r.id + '"></div>' +
        '<div class="glass block" data-fw="' + r.id + '"></div>'
      : '<div class="glass block" data-quality="' + r.id + '"></div>' +
        '<div class="glass block" data-apps="' + r.id + '"></div>' +
        '<div class="glass block" data-guests="' + r.id + '"></div>' +
        '<div class="glass block" data-sites="' + r.id + '"></div>' +
        '<div class="glass block" data-pause="' + r.id + '"></div>' +
        '<div class="glass block" data-fw="' + r.id + '"></div>' +
        '<div class="glass block" data-wifi="' + r.id + '">' + wifiHtml(r.id) + '</div>') +
    sshBlock(r) +
    '<div class="glass block" data-compat="' + r.id + '"></div>' +

    '<div class="actions">' +
      '<a class="glass act-card" data-open="easy.html"' + (r.reachable ? '' : ' aria-disabled="true"') + '><div class="f-ico">' + ic('zap') + '</div>' +
        '<div><b>Easy setup</b><span>The common settings, in plain words</span></div>' + ic('arrow', 'go') + '</a>' +
      '<a class="glass act-card" data-open="panel.html"' + (r.reachable ? '' : ' aria-disabled="true"') + '><div class="f-ico">' + ic('sliders') + '</div>' +
        '<div><b>Full control panel</b><span>Every setting on this router</span></div>' + ic('arrow', 'go') + '</a>' +
      '<a class="glass act-card" data-open="activity.html"><div class="f-ico">' + ic('activity') + '</div>' +
        '<div><b>Activity &amp; log</b><span>Who is using what, sites visited, every outage</span></div>' + ic('arrow', 'go') + '</a>' +
    '</div></section>';
}

// A confirmation box in the page (window.confirm is not shown inside the phone app).
// o = {title, html (already escaped), ok}. Resolves true / false. Cancel is focused first.
function askConfirm(o) {
  return new Promise(function (resolve) {
    var wrap = document.createElement('div');
    wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,20,.55)';
    wrap.innerHTML = '<div class="glass" style="max-width:480px;width:100%;padding:20px 22px;border-radius:16px;max-height:90vh;overflow:auto">' +
      '<h3 style="margin:0 0 10px;font-size:18px">' + esc(o.title) + '</h3>' +
      '<div style="font-size:14px;line-height:1.55">' + o.html + '</div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">' +
        '<button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>' + esc(o.ok) + '</button></div></div>';
    function onkey(e) { if (e.key === 'Escape') done(false); }
    function done(v) { document.removeEventListener('keydown', onkey); wrap.remove(); resolve(v); }
    wrap.addEventListener('click', function (e) { if (e.target === wrap) done(false); });
    wrap.querySelector('[data-no]').onclick = function () { done(false); };
    wrap.querySelector('[data-yes]').onclick = function () { done(true); };
    document.addEventListener('keydown', onkey);
    document.body.appendChild(wrap);
    wrap.querySelector('[data-no]').focus();
  });
}

// "Add a router": your account's API key. One key works on any number of routers. On each router you
// enter this website's address and the key (Remote access page, or the command below) and it joins
// your account by itself. Keys are listed here and can be revoked; a key is shown in full only once.
function addRouterDialog() {
  var wrap = document.createElement('div');
  wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,20,.55)';
  wrap.innerHTML = '<div class="glass" style="max-width:540px;width:100%;padding:20px 22px;border-radius:16px;max-height:90vh;overflow:auto">' +
    '<h3 style="margin:0 0 6px;font-size:18px">Connect your routers</h3>' +
    '<p class="mix-note" style="margin:0 0 10px"><b>A new router?</b> The <a href="BaytaarInstaller.exe">router installer for Windows</a> puts OpenWrt and the Baytaar software on a Linksys EA8100 or TP-Link Archer C6 v3 and joins it to your account with the key below. Windows warns that it is from an unknown publisher; choose More info, then Run anyway.</p>' +
    '<div data-body></div></div>';
  var body = wrap.querySelector('[data-body]');
  function close() { document.removeEventListener('keydown', onkey); wrap.remove(); }
  function onkey(e) { if (e.key === 'Escape') close(); }
  wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onkey);

  function copyBox(label, text) {
    var box = document.createElement('div');
    box.style.cssText = 'margin:0 0 12px';
    box.innerHTML = '<div style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:4px"></div>' +
      '<div style="display:flex;gap:8px;align-items:stretch"><code style="flex:1;word-break:break-all;padding:10px 12px;border-radius:10px;background:rgba(15,23,42,.07);font-size:13px;line-height:1.45"></code>' +
      '<button class="btn sm" type="button">Copy</button></div>';
    box.firstChild.textContent = label;
    box.querySelector('code').textContent = text;
    var cb = box.querySelector('button');
    cb.onclick = function () {
      var done = function () { cb.textContent = 'Copied'; setTimeout(function () { cb.textContent = 'Copy'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { toast('Select the text and copy it by hand.', true); });
      else toast('Select the text and copy it by hand.', true);
    };
    return box;
  }
  function when(ts) { return ts ? new Date(ts * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : 'never'; }

  function list() {
    body.innerHTML = '<p style="margin:0 0 12px;font-size:14px;line-height:1.5">Make a key, then on each router enter this website’s address and the key. ' +
      'The <b>same key works on every router you own</b>; each one joins your account by itself and shows up here.</p>' +
      '<div data-keys style="margin:0 0 14px"><div style="opacity:.6;font-size:13px">Loading your keys…</div></div>' +
      '<div style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:6px">New key</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" data-label maxlength="40" placeholder="Name it, e.g. School routers" style="flex:1;min-width:180px;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid rgba(100,116,139,.35);font-size:15px">' +
      '<button class="btn primary" data-make>Create key</button></div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" data-done>Close</button></div>';
    body.querySelector('[data-done]').onclick = close;
    var make = body.querySelector('[data-make]'), lab = body.querySelector('[data-label]');
    make.onclick = function () {
      make.disabled = true; make.textContent = 'Creating…';
      call('portal.php/api-keys', 'POST', { label: lab.value.trim() }).then(showKey)
        .catch(function (e) { make.disabled = false; make.textContent = 'Create key'; toast(e.message, true); });
    };
    lab.onkeydown = function (e) { if (e.key === 'Enter') make.click(); };
    call('portal.php/api-keys').then(function (j) {
      var box = body.querySelector('[data-keys]');
      if (!j.keys.length) { box.innerHTML = '<div style="opacity:.65;font-size:13px">You have no keys yet.</div>'; return; }
      box.innerHTML = '';
      j.keys.forEach(function (k) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(100,116,139,.2)';
        row.innerHTML = '<div style="flex:1;min-width:0"><b data-l></b><div style="font-size:12.5px;opacity:.7" data-m></div></div><button class="btn sm" data-rev>Revoke</button>';
        row.querySelector('[data-l]').textContent = k.label;
        row.querySelector('[data-m]').textContent = k.prefix + '…  ·  ' + k.routers + (k.routers === 1 ? ' router' : ' routers') + ' joined  ·  last used ' + when(k.last_used);
        row.querySelector('[data-rev]').onclick = function () {
          askConfirm({ title: 'Revoke this key?', html: 'Routers that already joined keep working. This key just cannot connect any more routers.', ok: 'Revoke' }).then(function (yes) {
            if (!yes) return;
            call('portal.php/api-keys/revoke', 'POST', { id: k.id }).then(list).catch(function (e) { toast(e.message, true); });
          });
        };
        box.appendChild(row);
      });
    }).catch(function (e) { body.querySelector('[data-keys]').textContent = e.message; });
  }

  function showKey(j) {
    body.innerHTML = '<p style="margin:0 0 12px;font-size:14px;line-height:1.5">Key <b></b> is ready. It is shown in full <b>only now</b>, so copy it. On each router, open <b>Remote Access</b> in its panel, enter these two things and press Connect:</p>';
    body.querySelector('b').textContent = j.label;
    body.appendChild(copyBox('Website address', j.site));
    body.appendChild(copyBox('API key', j.key));
    var alt = document.createElement('details');
    alt.style.cssText = 'margin:0 0 12px;font-size:13px';
    alt.innerHTML = '<summary style="cursor:pointer;opacity:.8">Or paste one command over SSH</summary>';
    alt.appendChild(copyBox('Command', j.command));
    body.appendChild(alt);
    var note = document.createElement('p');
    note.style.cssText = 'margin:0 0 4px;font-size:13px;line-height:1.5;opacity:.85';
    note.textContent = 'Use it on as many routers as you like. Each one appears in your list within about a minute. Anyone with this key can add routers to your account, so keep it private; if it leaks, revoke it here.';
    body.appendChild(note);
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:flex-end;margin-top:14px';
    row.innerHTML = '<button class="btn primary">Done</button>';
    row.firstChild.onclick = function () { close(); lastKey = null; load(); };
    body.appendChild(row);
  }

  list();
  document.body.appendChild(wrap);
}
/* This router: what it can do with this website, rename, remove. The router says what it supports
   (portal.php/capabilities); anything it or the website lacks is listed with the side to update. */
var COMPAT = {};
function paintCompat(r) {
  var el = $('[data-compat="' + r.id + '"]'); if (!el) return;
  var hit = COMPAT[r.id];
  if (hit) draw(hit.j);
  else el.innerHTML = '<div class="sec-h"><h3>' + ic('sliders') + 'This router</h3></div><p class="mix-note">Checking what it can do…</p>';
  if (!hit || Date.now() - hit.t > 300000) fetchCaps(false);

  function fetchCaps(force) {
    call('portal.php/capabilities?r=' + r.id + (force ? '&refresh=1' : '')).then(function (j) {

function wire(r, locOpen) {
  paintCompat(r);

  var base = 'api.php/r/' + r.id;
  function post(route, body, okMsg, after) {
    return call(base + route, 'POST', body).then(function (j) {
      toast(okMsg || j.message || 'Saved');

  }
  var boxEl = $('[data-loc-box]', el);

  $('[data-loc-open]', el).onclick = function () { boxEl.hidden = !boxEl.hidden; if (!boxEl.hidden) $('[data-loc]', el).focus(); };
  $('[data-loc-save]', el).onclick = function () { post('/site', { location: $('[data-loc]', el).value }, 'Location saved', function () { boxEl.hidden = true; }); };
  $('[data-loc]', el).onkeydown = function (e) { if (e.key === 'Enter') $('[data-loc-save]', el).click(); };

  $$('[data-force]', el).forEach(function (b) {
    b.onclick = function () {

      function go(msg) {

        b.innerHTML = '<span class="spinner"></span> Switching';
        post('/site/force', { iface: iface }, msg).then(function () { lastKey = null; load(); });   // repaint even after an error
      }
      if (!iface) { go('Back to the normal line order'); return; }       // stopping is harmless: no warning needed
      var s = r.site || {}, wans = s.wans || [];
      var target = wans.filter(function (w) { return w.iface === iface; })[0] || {};
      var others = wans.filter(function (w) { return w.iface !== iface && w.connected; });
      var onOthers = others.reduce(function (n, w) { return n + (w.devices || 0); }, 0);
      var name = lineTitle(target);
      var html =
        '<p style="margin:0 0 10px"><b>' + onOthers + (onOthers === 1 ? ' device is' : ' devices are') + ' using the other line right now</b>' +
        ' and ' + (target.devices || 0) + ' ' + ((target.devices || 0) === 1 ? 'is' : 'are') + ' on ' + esc(name) + '. Everything behind a Wi-Fi router counts as one device.</p>' +
        '<p style="margin:0 0 10px"><b>Moving everyone resets their open connections.</b> Calls, video, downloads and games will pause or drop for a few seconds, and some people may have to reload a page.</p>' +
        '<p style="margin:0 0 10px">Only ' + esc(name) + ' will carry traffic. The other line steps in only if this one fails.</p>' +
        '<p style="margin:0">The router checks within 30 seconds that ' + esc(name) + ' really works. If it does not, it switches back to the normal order by itself.</p>';
      askConfirm({ title: 'Send everything through ' + name + '?', html: html, ok: 'Move everyone to ' + name }).then(function (yes) {
        if (!yes) return;
        go('Switching to ' + name + '. The router is checking it, about 30 seconds.');
        // after the router's own check, say so if it had to switch back
        setTimeout(function () {
          call(base + '/site').then(function (j) {
            if (j && j.forced !== iface) toast('The router switched back to the normal order: ' + name + ' did not pass its check. See the alerts for the reason.', true);
            lastKey = null; load();
          }).catch(function () {});
        }, 38000);
      });
    };
  });
  $$('[data-test-line]', el).forEach(function (b) {
    b.onclick = function () {
      var iface = b.getAttribute('data-test-line'), k = r.id + ':' + iface, t0 = Math.floor(Date.now() / 1000) - 5;
      if (TESTING[k]) return;
      TESTING[k] = 1;
      b.innerHTML = '<span class="spinner"></span> Testing'; b.disabled = true;
      toast('Testing ' + iface.toUpperCase() + '. Takes about half a minute.');
      call('api.php/r/' + r.id + '/ports/test', 'POST', { iface: iface }).then(function () {
        var tries = 0;
        (function poll() {
          call('api.php/r/' + r.id + '/ports').then(function (j) {
            var res = (j.results || {})[iface] || {};
            if (res.tested_at && res.tested_at >= t0 && res.status !== 'running') {
              delete TESTING[k];
              if (res.status === 'ok') toast(iface.toUpperCase() + ': ' + (res.down_mbps || '?') + ' Mbps down, ' + (res.up_mbps || '?') + ' up, ' + (res.latency_ms || '?') + ' ms, ' + (res.isp || 'provider unknown'));
              else toast(iface.toUpperCase() + ': ' + (res.message || 'test failed'));
              load();
              return;
            }
            if (++tries < 40) setTimeout(poll, 3000); else { delete TESTING[k]; toast('The test is taking long; results appear when it finishes.'); }
          }).catch(function () { if (++tries < 40) setTimeout(poll, 3000); else delete TESTING[k]; });
        })();

    };

  $$('[data-edit-open]', el).forEach(function (b) {
    var iface = b.getAttribute('data-edit-open'), row = $('[data-edit="' + iface + '"]', el), inp = $('[data-name="' + iface + '"]', el);
    var ek = r.id + ':' + iface;

    $('[data-save="' + iface + '"]', el).onclick = function () {
      post('/site/name', { iface: iface, name: inp.value }, 'Name saved', function () { openEdits[ek] = false; });
    };
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') $('[data-save="' + iface + '"]', el).click();
      if (e.key === 'Escape') { row.hidden = true; openEdits[ek] = false; inp.blur(); }
    };
  });
  var wf = $('[data-wifi="' + r.id + '"]', el);
  if (wf) { wireWifi(wf, r.id); if (r.reachable && (!WIFI[r.id] || !WIFI[r.id].t || Date.now() - WIFI[r.id].t > 60000)) { loadWifi(r.id).then(function () { if (WIFI[r.id]) WIFI[r.id].t = Date.now(); }); } }
  $$('[data-copy]', el).forEach(function (pre) {
    pre.onclick = function () {
      var t = pre.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Copied'); }).catch(function () {});
    };
  });
  $$('[data-open-panel]', el).forEach(function (a) {
    a.href = 'panel.html#/access';
    a.onclick = function () { try { localStorage.setItem('bt-router', String(r.id)); } catch (e) {} };
  });
  $$('[data-open]', el).forEach(function (a) {
    a.href = a.getAttribute('data-open');
    a.onclick = function () { try { localStorage.setItem('bt-router', String(r.id)); } catch (e) {} };
  });
}

/* ======================= call quality + devices =======================
   Loaded separately from the router card so a refresh here never redraws the
   card above it. X[id] keeps the last answers; each section repaints only
   when its own data changed. */
var X = {}, qTimer = {};

function fmtBytes(n) {
  if (!n) return '0 MB';
  if (n >= 1e12) return (n / 1e12).toFixed(2) + ' TB';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' GB';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + ' MB';
  return Math.max(1, Math.round(n / 1e3)) + ' KB';
}

// What each kind of call needs. [good up to, usable up to]
var PROFILES = [
  { name: 'WhatsApp voice call', icon: 'phone', need: 0.1, lat: [150, 300], jit: [30, 60], loss: [1, 3] },
  { name: 'WhatsApp video call', icon: 'video', need: 1.5, lat: [150, 300], jit: [30, 50], loss: [1, 2.5] },
  { name: 'Zoom meeting (HD)',   icon: 'users', need: 3.0, lat: [150, 300], jit: [40, 60], loss: [1, 2] }
];
var RATE = ['Not usable', 'Poor', 'Fair', 'Good', 'Excellent'];

function judge(p, q) {
  if (q.latency_ms === null || q.received === 0) return { s: 0, why: 'No reply came back on this line.' };
  var s = 4, why = '';
  function cap(level, msg) { if (level < s) { s = level; why = msg; } }
  if (q.loss_pct > p.loss[1]) cap(1, q.loss_pct + '% of packets were lost, calls will break up.');
  else if (q.loss_pct > p.loss[0]) cap(2, q.loss_pct + '% packet loss, expect small gaps.');
  if (q.jitter_ms > p.jit[1]) cap(1, 'Delay jumps around by ' + q.jitter_ms + ' ms, audio will stutter.');
  else if (q.jitter_ms > p.jit[0]) cap(2, 'Delay wobbles by ' + q.jitter_ms + ' ms, slightly choppy.');
  if (q.latency_ms > p.lat[1]) cap(1, q.latency_ms + ' ms delay, people will talk over each other.');
  else if (q.latency_ms > p.lat[0]) cap(2, q.latency_ms + ' ms delay is noticeable.');
  var slow = [q.down_mbps, q.up_mbps].filter(function (v) { return v !== null && v !== undefined; });
  if (slow.length) {
    var bw = Math.min.apply(null, slow);
    if (bw < p.need) cap(1, 'Only ' + bw + ' Mbps available, this needs ' + p.need + '.');
    else if (bw < p.need * 2) cap(2, bw + ' Mbps leaves little room above the ' + p.need + ' needed.');
    else if (bw < p.need * 4) cap(3, 'Enough speed, with modest headroom.');
  }
  if (s === 4 && (q.latency_ms > p.lat[0] / 2 || q.jitter_ms > p.jit[0] / 2 || q.loss_pct > 0)) { s = 3; why = 'Comfortably inside what this needs.'; }
  if (!why) why = 'Delay, jitter and loss are all very low.';
  return { s: s, why: why };
}

function extras(r) {
  var id = r.id, base = 'api.php/r/' + id;
  X[id] = X[id] || {};
  call(base + '/apps').then(function (a) { X[id].apps = a; paintApps(id); }).catch(function () {});
  call(base + '/devices').then(function (d) { X[id].rates = d.devices || []; paintApps(id); }).catch(function () {});
  call(base + '/guests').then(function (g) { X[id].guests = g; paintGuests(id); paintPeopleHere(); }).catch(function () {});
  call(base + '/sites').then(function (b) { X[id].sites = b; paintSites(id); }).catch(function () {});
  call(base + '/pause').then(function (p) { X[id].pause = p; paintPause(id); }).catch(function () {});
  if (!fwTimer[id]) call(base + '/software').then(function (f) { X[id].fw = f; paintFw(id); if (f.state === 'running') watchFw(id); }).catch(function () {});
  loadNewest(false);
  if (!qTimer[id]) call(base + '/quality').then(function (q) { X[id].q = q; paintQuality(id); if (q.running) watchQuality(id); }).catch(function () {});
  paintExtras(id, false);
}
function paintExtras(id, offline) {
  X[id] = X[id] || {};
  X[id].offline = !!offline;       // part of each section's change key
  paintQuality(id); paintApps(id); paintGuests(id); paintSites(id); paintFw(id);
}
function watchQuality(id) {
  clearInterval(qTimer[id]);
  qTimer[id] = setInterval(function () {
    call('api.php/r/' + id + '/quality').then(function (q) {
      X[id].q = q; paintQuality(id);
      if (!q.running) { clearInterval(qTimer[id]); qTimer[id] = null; }
    }).catch(function () { clearInterval(qTimer[id]); qTimer[id] = null; });
  }, 2000);
}

function paintQuality(id) {
  var el = $('[data-quality="' + id + '"]'); if (!el) return;
  var st = X[id] || {}, q = st.q, key = JSON.stringify([q, st.offline]);
  if (key === st.qKey && el.firstChild) return;
  st.qKey = key;
  var running = q && q.running;
  var head = '<div class="sec-h"><h3>' + ic('phone') + 'Call quality check</h3>' +
    (running ? '<span class="running" style="margin-left:auto"><span class="spin"></span>Measuring, about 20 seconds</span>'
             : '<button class="btn primary sm" data-qrun' + (st.offline ? ' disabled' : '') + '>' + ic('play', 'sm') + (q && q.results && q.results.length ? 'Run again' : 'Run test') + '</button>') +
    '</div><p class="sec-sub">Measures delay, jitter and packet loss on every line and on all lines mixed together, then rates how WhatsApp and Zoom calls would hold up.</p>';
  var body = '';
  ((q && q.results) || []).forEach(function (x) {
    var isMix = x.iface === 'mix';
    if (x.status === 'notconnected') { body += '<div class="q-row muted">' + ic('unplug', 'sm') + esc(x.iface.toUpperCase()) + ': no line connected, so nothing to test.</div>'; return; }
    if (x.status !== 'ok') { body += '<div class="q-row muted"><span class="spin" style="border-color:rgba(37,99,235,.25);border-top-color:var(--a1)"></span>' + esc(x.label) + ': measuring…</div>'; return; }
    var metrics =
      '<div class="metric">Delay<b>' + (x.latency_ms === null ? '—' : x.latency_ms + ' ms') + '</b></div>' +
      '<div class="metric">Jitter<b>' + (x.jitter_ms === null ? '—' : x.jitter_ms + ' ms') + '</b></div>' +
      '<div class="metric">Packet loss<b>' + x.loss_pct + ' %</b></div>' +
      '<div class="metric">Download<b>' + (x.down_mbps === null ? '—' : x.down_mbps + ' Mbps') + '</b></div>' +
      '<div class="metric">Upload<b>' + (x.up_mbps === null ? '—' : x.up_mbps + ' Mbps') + '</b></div>';
    var tiles = PROFILES.map(function (p) {
      var j = judge(p, x), bars = '';
      for (var i = 1; i <= 4; i++) bars += '<i' + (i <= j.s ? ' class="on"' : '') + '></i>';
      return '<div class="verdict v' + j.s + '"><div class="v-top"><div class="v-ico">' + ic(p.icon, 'sm') + '</div><b>' + esc(p.name) + '</b></div>' +
        '<div class="v-rate">' + RATE[j.s] + '</div><div class="v-bars">' + bars + '</div><div class="v-why">' + esc(j.why) + '</div></div>';
    }).join('');
    body += '<div class="q-row"><div class="q-head"><b>' + esc(x.label) + '</b><span class="tag">' + (isMix ? 'what devices actually get' : esc(x.iface.toUpperCase())) + '</span></div>' +
      '<div class="q-metrics">' + metrics + '</div><div class="verdicts">' + tiles + '</div></div>';
  });
  if (body) body += '<div class="q-note">This measures the line itself. It does not place a real call, so treat the ratings as a strong hint, not a guarantee. Speeds are from the router\'s own test and read lower than a speed test on a laptop.</div>';
  el.innerHTML = head + body;
  var b = $('[data-qrun]', el);
  if (b) b.onclick = function () {
    b.disabled = true;
    call('api.php/r/' + id + '/quality/test', 'POST', {}).then(function () {
      X[id].q = { running: true, results: [] }; paintQuality(id); watchQuality(id);
    }).catch(function (e) { toast(e.message, true); b.disabled = false; });
  };
}

/* One colour per app, the same in every chip, bar and chart. Eight checked,
   colour-blind-safe colours; the common apps have their own, others are
   given one by name, and Unknown/Other are grey. Names always sit beside the
   colour, so it is never the only clue. */
var SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
var APP_SLOT = { 'Google': 0, 'Netflix': 1, 'TikTok': 2, 'Speed test': 3, 'Instagram': 4, 'WhatsApp': 5, 'Facebook': 6, 'YouTube': 7 };
var GREY = '#a3acb9';
function appColor(app) {
  if (!app || app === 'Unknown' || app === 'Other') return GREY;
  if (APP_SLOT.hasOwnProperty(app)) return SERIES[APP_SLOT[app]];
  for (var h = 0, i = 0; i < app.length; i++) h = (h * 31 + app.charCodeAt(i)) >>> 0;
  return SERIES[h % SERIES.length];
}
function fmtN(n) { return Number(n || 0).toLocaleString('en-US'); }

/* hover (or tap) on any chart mark: a small label with its name and value */
var TIP = null;
function tipShow(t, x, y) {
  if (!TIP) { TIP = document.createElement('div'); TIP.className = 'tipbox'; document.body.appendChild(TIP); }
  TIP.textContent = t; TIP.hidden = false;
  var W = document.documentElement.clientWidth;
  TIP.style.left = Math.max(8, Math.min(x + 12, W - TIP.offsetWidth - 8)) + 'px';
  TIP.style.top = Math.max(8, y - TIP.offsetHeight - 12) + 'px';
}
function tipHide() { if (TIP) TIP.hidden = true; }
document.addEventListener('mousemove', function (e) {
  var m = e.target.closest && e.target.closest('[data-tip]');
  if (m) tipShow(m.getAttribute('data-tip'), e.clientX, e.clientY); else tipHide();
});
document.addEventListener('click', function (e) {
  var m = e.target.closest && e.target.closest('[data-tip]');
  if (!m) return;
  var r = m.getBoundingClientRect();
  tipShow(m.getAttribute('data-tip'), r.left + r.width / 2 - 12, r.top);
  clearTimeout(tipHide.t); tipHide.t = setTimeout(tipHide, 2500);
});
window.addEventListener('scroll', tipHide, { passive: true });

/* one whole split into parts (biggest first, small ones folded into Other) */
function segBar(parts, cls) {
  var tot = parts.reduce(function (s2, x) { return s2 + x.v; }, 0) || 1;
  return '<div class="segbar' + (cls ? ' ' + cls : '') + '" role="img" aria-label="' + esc(parts.map(function (x) { return x.label + ' ' + Math.round(x.v / tot * 100) + '%'; }).join(', ')) + '">' +

  return fetch('fw/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.version && /^[0-9a-f]{64}$/.test(j.sha256 || '')) newest = j; Object.keys(X).forEach(paintFw); return newest; })
    .catch(function () { return newest; });
}
var fwTimer = {};
function watchFw(id) {
  if (fwTimer[id]) return;
  var misses = 0;
  fwTimer[id] = setInterval(function () {
    call('api.php/r/' + id + '/software').then(function (f) {
      misses = 0; X[id].fw = f; paintFw(id);
      if (f.state !== 'running') {
        clearInterval(fwTimer[id]); fwTimer[id] = null;
        toast(f.message || 'Done', f.state === 'failed');
      }
    }).catch(function () { if (++misses > 40) { clearInterval(fwTimer[id]); fwTimer[id] = null; } });
  }, 3000);
}
function paintFw(id) {
  var el = $('[data-fw="' + id + '"]'); if (!el) return;
  var st = X[id] || {}, f = st.fw;
  var key = JSON.stringify([f, st.offline, newest && newest.version]);
  if (key === st.fKey && el.firstChild) return;
  st.fKey = key;
  if (f) { f.latest = newest ? newest.version : ''; f.notes = newest ? newest.notes : ''; f.available = !!(newest && newest.version !== f.current); }
  var head = '<div class="sec-h"><h3>' + ic('zap') + 'Router software</h3></div>' +
    '<p class="sec-sub">Upgrade this router from here, wherever it is. Its settings, signed-in people and block list are kept, and the internet stays on while it upgrades.</p>';
  if (!f) { el.innerHTML = head + '<div class="q-row muted">' + (st.offline ? 'Router is offline. It can be upgraded when it is back online.' : 'Loading…') + '</div>'; return; }
  var run = f.state === 'running', dis = (st.offline || run) ? ' disabled' : '';
  var tag = run ? '<span class="tag mid">Upgrading</span>' : f.available ? '<span class="tag mid">Upgrade available</span>' : (f.latest ? '<span class="tag ok">Up to date</span>' : '<span class="tag">Could not check</span>');
  el.innerHTML = head +
    '<div class="fw-row"><div class="fw-v">Installed<b>' + esc(f.current) + '</b></div>' +
      '<div class="fw-v">Newest<b>' + esc(f.latest || 'unknown') + '</b></div>' +
      '<div class="fw-v">System<b>' + esc(f.system || '') + '</b></div>' + tag +
      '<div class="g-btns"><button class="btn sm" data-fwcheck' + dis + '>Check again</button>' +
        (f.available || run ? '<button class="btn primary sm" data-fwup' + dis + '>' + (run ? '<span class="spin"></span>Upgrading…' : ic('zap', 'sm') + 'Upgrade now') + '</button>' : '') + '</div></div>' +
    (run || f.state === 'failed' ? '<div class="q-row muted">' + ic(run ? 'clock' : 'alert', 'sm') + '<span>' + esc(f.message) + '</span></div>' : '') +
    (f.available && f.notes ? '<div class="q-note">What is new: ' + esc(f.notes) + '</div>' : '');
  var base = 'api.php/r/' + id;
  var up = $('[data-fwup]', el), ck = $('[data-fwcheck]', el);
  if (up) up.onclick = function () {
    up.disabled = true;
    call(base + '/software/upgrade', 'POST', { version: newest.version, sha256: newest.sha256 }).then(function (j) {
      toast(j.message || 'Upgrade started');
      X[id].fw = Object.assign({}, f, { state: 'running', message: 'Starting.' }); paintFw(id); watchFw(id);
    }).catch(function (e) { toast(e.message, true); up.disabled = false; });
  };
  ck.onclick = function () {
    ck.disabled = true;
    loadNewest(true).then(function () { return call(base + '/software'); })
      .then(function (j) { X[id].fw = j; st.fKey = ''; paintFw(id); toast(newest && newest.version !== j.current ? 'A newer version is available' : 'This router is up to date'); })
      .catch(function (e) { toast(e.message, true); ck.disabled = false; });
  };
}

// boot: an existing cookie session goes straight to the dashboard
// Open on the saved copy straight away; the sign-in check runs alongside.
(function () {
  var sn = snapLoad();
  if (!sn || !sn.u) return;
  $('#auth').hidden = true; $('#dash').hidden = false;
  $('#who').textContent = sn.u;
  $('#avatar').textContent = sn.u.charAt(0).toUpperCase();
  snapShown = snapShow(sn);
})();
function checkMe() {
  call('portal.php/me').then(function (j) {
    if (snapShown && $('#who').textContent !== j.user.email) { snapClear(); snapShown = false; X = {}; }
    showDash(j.user);
  }).catch(function (e) {
    if (e && e.message === 'Signed out') return;            // a 401 already showed the sign-in form
    if (snapShown) { setSync('off', 'Can’t reach the website. Retrying…'); setTimeout(checkMe, 8000); }
    else showAuth();
  });
}
checkMe();
})();
</script>
